<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2E8D7"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C7A32"/>
      <stop offset="50%" stop-color="#B8924A"/>
      <stop offset="100%" stop-color="#E8D3A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgP1)"/>
  <!-- Browser top bar -->
  <rect width="1200" height="54" fill="#FFFFFF"/>
  <circle cx="36" cy="27" r="6" fill="#EDE2CD"/>
  <circle cx="56" cy="27" r="6" fill="#EDE2CD"/>
  <circle cx="76" cy="27" r="6" fill="#EDE2CD"/>
  <rect x="180" y="14" width="840" height="26" rx="13" fill="#FBF7EF"/>
  <text x="600" y="32" font-family="'Jost', sans-serif" font-size="12" fill="#7B756B" text-anchor="middle">drabeatrizleao.com.br — Harmonização Facial &amp; Estética de Luxo</text>

  <!-- Website Hero Preview inside mockup -->
  <g transform="translate(100, 110)">
    <!-- Brand / Nav -->
    <text x="0" y="36" font-family="'Cormorant Garamond', serif" font-size="28" font-weight="600" fill="#2D2B28" letter-spacing="0.1em">DRA. BEATRIZ LEÃO</text>
    <text x="0" y="58" font-family="'Jost', sans-serif" font-size="12" fill="#B8924A" letter-spacing="0.15em">HARMONIZAÇÃO FACIAL • SÃO PAULO</text>
    
    <!-- Hero Title -->
    <text x="0" y="150" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="500" fill="#2D2B28">A arte de realçar sua</text>
    <text x="0" y="210" font-family="'Cormorant Garamond', serif" font-size="56" font-style="italic" fill="url(#goldText)">beleza com naturalidade.</text>
    
    <text x="0" y="260" font-family="'Jost', sans-serif" font-size="16" fill="#7B756B" width="480">
      Protocolos exclusivos que respeitam sua identidade anatômica.
    </text>
    <text x="0" y="285" font-family="'Jost', sans-serif" font-size="16" fill="#7B756B">
      Sem exageros, com precisão médica e sofisticação incomparável.
    </text>

    <!-- Mini CTA button -->
    <rect x="0" y="330" width="220" height="48" rx="24" fill="url(#goldText)"/>
    <text x="110" y="360" font-family="'Jost', sans-serif" font-size="14" font-weight="500" fill="#2D2B28" text-anchor="middle">AGENDAR AVALIAÇÃO</text>

    <!-- Right Side Hero Image Card -->
    <g transform="translate(560, 10)">
      <rect width="420" height="520" rx="210" fill="#EDE2CD" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Soft silhouette / face highlight -->
      <path d="M 120,490 C 130,340 190,260 210,180 C 230,260 290,340 300,490 Z" fill="#F8F3E8"/>
      <ellipse cx="210" cy="180" rx="75" ry="95" fill="#F4DAC7"/>
      <path d="M 140,160 Q 210,90 280,160 Q 260,260 210,270 Q 160,260 140,160 Z" fill="#4A3B31"/>
      <circle cx="210" cy="205" r="3" fill="#B8924A"/>
      <!-- Floating glass tag on card -->
      <rect x="40" y="380" width="200" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.85" stroke="#EDE2CD"/>
      <text x="140" y="404" font-family="'Jost', sans-serif" font-size="12" font-weight="600" fill="#2D2B28" text-anchor="middle">Protocolo Full Face</text>
      <text x="140" y="420" font-family="'Jost', sans-serif" font-size="11" fill="#B8924A" text-anchor="middle">✦ 100% Personalizado</text>
    </g>
  </g>
</svg>
